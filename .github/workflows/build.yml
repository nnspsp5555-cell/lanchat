name: Build LanChat APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unpack project
        run: |
          mkdir work
          unzip -q project.zip -d work
          D=$(dirname "$(find work -name settings.gradle.kts | head -1)")
          echo "PROJ=$D" >> $GITHUB_ENV
      - name: Build
        run: |
          cd "$PROJ"
          gradle assembleDebug --no-daemon
      - name: Collect APK
        run: cp "$PROJ/app/build/outputs/apk/debug/app-debug.apk" LanChat.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: LanChat ${{ github.run_number }}
          files: LanChat.apk
